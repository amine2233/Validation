name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITHUB_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: amine2233/ci-shared/.github/workflows/ci.yml@1.1
    with:
      enable-macos: true
      enable-linux: true
      enable-lint: true
      enable-coverage: false
      enable-title-check: true
